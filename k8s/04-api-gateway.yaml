apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: healthcare-platform
data:
  NODE_ENV: "production"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  CORS_ORIGIN: "*"
  # Service discovery via Kubernetes DNS
  AUTH_SERVICE_URL: "http://auth-service.healthcare-platform.svc.cluster.local:5001"
  PATIENT_SERVICE_URL: "http://patient-service.healthcare-platform.svc.cluster.local:5002"
  CONSULTATION_SERVICE_URL: "http://consultation-service.healthcare-platform.svc.cluster.local:5003"
  APPOINTMENT_SERVICE_URL: "http://appointment-service.healthcare-platform.svc.cluster.local:5004"
  DOCTOR_SERVICE_URL: "http://doctor-service.healthcare-platform.svc.cluster.local:5005"
  PAYMENT_SERVICE_URL: "http://payment-notification-service.healthcare-platform.svc.cluster.local:5006"
  NOTIFICATION_SERVICE_URL: "http://notification-service.healthcare-platform.svc.cluster.local:5007"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: healthcare-platform
  labels:
    app: api-gateway
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
      - name: api-gateway
        image: api-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        
        envFrom:
        - configMapRef:
            name: api-gateway-config
        - secretRef:
            name: app-secrets
        
        env:
        - name: PORT
          value: "3000"
        - name: LOG_LEVEL
          value: "info"
        
        # Resource management
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        # Liveness probe - restart if not responsive
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness probe - mark as ready when healthy
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Security context for container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      
      volumes:
      - name: tmp
        emptyDir: {}
      
      # Pod disruption budget for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - api-gateway
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: healthcare-platform
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: api-gateway

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-external
  namespace: healthcare-platform
  labels:
    app: api-gateway
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  selector:
    app: api-gateway

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: healthcare-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: healthcare-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
